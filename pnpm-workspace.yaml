packages:
  - packages/*
  - test
allowBuilds:
  # Optional native accelerator pulled in through effect -> msgpackr; the JS fallback is
  # enough, so its build script stays off.
  msgpackr-extract: false
# oas-truth 0.5.1 is this repository's parser sibling, published today. pnpm's default
# 24-hour floor rejects it in CI until then; the lockfile already pins it.
minimumReleaseAgeExclude:
  - oas-truth@0.5.1
  - schema-truth@0.7.0
