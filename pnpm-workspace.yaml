packages:
  - apps/*
  - packages/*
  - test
allowBuilds:
  # Optional native accelerator pulled in through effect -> msgpackr; the JS fallback is
  # enough, so its build script stays off.
  msgpackr-extract: false
  # tsx (the todo example's runner) installs esbuild's native binary through this script.
  esbuild: true
minimumReleaseAgeExclude:
  - oas-truth@0.8.0
  - schema-truth@0.8.8
